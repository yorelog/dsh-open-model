# Bundle patch: one Host row. All knobs live under `config` and hot-reload
# because the Loader restarts this row when the configuration changes.
#
# Example (uncomment and edit in the profile patch to override defaults):
#   - id: dsh-open-model
#     name: 'dsh-open-model'
#     config:
#       idleTimeoutMs: 300000
#       proxy:
#         https: http://127.0.0.1:7890
#       githubProxyPrefix: https://gh-proxy.com/
- insert:
    - id: dsh-open-model
      name: 'dsh-open-model'
